[project]
name = "mt"
version = "0.1.0"
description = "Cross-platform YouTube downloader and local P2P sharing application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp>=2026.6.9",
    "pywebview>=5.1",
    "aiohttp>=3.9.5",
    "aiosqlite>=0.20.0",
    "watchdog>=4.0.0",
    "zeroconf>=0.135.0",
    "aiofiles>=23.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mt"]
